<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Dentaly — CRM для стоматологии</title>
<style>
:root{
  --bg:#F5F7F8;--surface:#FFFFFF;--surface-2:#FAFBFB;
  --border:#E5E9EB;--border-2:#EEF1F2;
  --text:#0F1F1E;--text-2:#5B6B6A;--text-3:#8B9695;
  --primary:#0F766E;--primary-2:#115E59;--primary-soft:#CCFBF1;--primary-tint:#F0FDFA;
  --amber:#D97706;--amber-soft:#FEF3C7;
  --red:#DC2626;--red-soft:#FEE2E2;
  --green:#059669;--green-soft:#D1FAE5;
  --blue:#2563EB;--blue-soft:#DBEAFE;
  --purple:#7C3AED;--purple-soft:#EDE9FE;
  --gold:#CA8A04;--gold-soft:#FEF3C7;
  --sidebar:#0E1F1E;--sidebar-2:#152C2A;--sidebar-text:#A8B8B6;--sidebar-text-2:#7A8C8A;
  --shadow-sm:0 1px 2px rgba(15,31,30,.04);
  --shadow-lg:0 4px 12px rgba(15,31,30,.08),0 24px 48px rgba(15,31,30,.08);
  --r:10px;--r-lg:14px;--r-xl:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}

#app{display:grid;grid-template-columns:236px 1fr;height:100vh}
#sidebar{background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;overflow:hidden}
#main-wrap{display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px 28px 60px}

.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:10px}
.brand-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0F766E,#2DD4BF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
.brand-name{color:#fff;font-weight:600;font-size:15px}
.brand-sub{color:var(--sidebar-text-2);font-size:11px;margin-top:1px}
.clinic-switch{margin:0 12px 14px;padding:10px 12px;background:var(--sidebar-2);border-radius:var(--r);display:flex;align-items:center;gap:9px;cursor:pointer}
.clinic-switch:hover{background:#1A3735}
.clinic-dot{width:8px;height:8px;border-radius:50%;background:#2DD4BF;box-shadow:0 0 0 3px rgba(45,212,191,.18)}
.clinic-name{color:#E5EEED;font-weight:500;font-size:13px;flex:1}
.clinic-name .chev{color:var(--sidebar-text-2);float:right}
.nav-section{padding:8px 12px}
.nav-label{font-size:11px;color:var(--sidebar-text-2);text-transform:uppercase;letter-spacing:.6px;padding:8px 10px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--sidebar-text);font-size:13.5px;cursor:pointer;margin-bottom:1px;font-weight:500;transition:all .12s}
.nav-item:hover{background:var(--sidebar-2);color:#E5EEED}
.nav-item.active{background:linear-gradient(90deg,rgba(15,118,110,.25),rgba(15,118,110,.1));color:#fff}
.nav-item.active .nav-icon{color:#2DD4BF}
.nav-icon{width:18px;height:18px;flex-shrink:0;color:var(--sidebar-text-2)}
.dot-sep{color:var(--text-3);margin:0 6px}
.teeth-half.right{flex-direction:row}
.tp-h-text{flex:1}
.inv-low{background:rgba(220,38,38,.04)}
.inv-low td:first-child{border-left:3px solid var(--red)}

/* Treatment plan v2 */
.plan-hero{padding:18px 20px;background:linear-gradient(135deg,var(--primary-tint),#fff);border:1px solid var(--primary-soft);border-radius:var(--r-lg);display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.plan-hero-stat{flex:1;min-width:120px}
.plan-hero-label{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.plan-hero-value{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-top:3px}
.variant-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.variant-card{padding:14px;border:1.5px solid var(--border);border-radius:var(--r-lg);background:var(--surface);cursor:pointer;transition:all .15s;position:relative}
.variant-card:hover{border-color:var(--text-3)}
.variant-card.active{border-color:var(--primary);background:var(--primary-tint);box-shadow:0 0 0 3px rgba(15,118,110,.08)}
.variant-card.active::before{content:'✓';position:absolute;top:10px;right:12px;color:var(--primary);font-weight:700}
.variant-name{font-weight:700;font-size:14px}
.variant-sub{font-size:11.5px;color:var(--text-2);margin-top:3px;line-height:1.4;min-height:32px}
.variant-price{font-size:18px;font-weight:700;color:var(--primary-2);margin-top:10px;letter-spacing:-.3px}
.variant-meta{font-size:11px;color:var(--text-3);margin-top:3px}

.visit-card{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;transition:border-color .15s}
.visit-card:hover{border-color:#CBD5E1}
.visit-card.done{background:linear-gradient(180deg,#FAFCFC,#fff)}
.visit-card.planned{border-style:dashed}
.visit-head{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border-2)}
.visit-date{background:var(--primary-tint);color:var(--primary-2);border-radius:8px;padding:6px 10px;text-align:center;min-width:54px;flex-shrink:0}
.visit-date.done{background:#F1F3F4;color:var(--text-2)}
.visit-date-d{font-size:18px;font-weight:700;line-height:1}
.visit-date-m{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
.visit-stage{display:grid;grid-template-columns:46px 1fr 100px 120px 36px;gap:12px;padding:10px 16px;align-items:center;border-bottom:1px solid var(--border-2);font-size:13px}
.visit-stage:last-child{border-bottom:none}
.visit-stage:hover{background:var(--surface-2)}
.stage-tooth{width:36px;height:36px;border-radius:8px;background:var(--primary-tint);color:var(--primary-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.stage-tooth.done{background:#F1F3F4;color:var(--text-2)}
.add-visit-btn{padding:14px 18px;background:transparent;border:1.5px dashed var(--border);border-radius:var(--r-lg);color:var(--text-2);cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;transition:all .15s}
.add-visit-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-tint)}

/* Telegram brand color */
.b-tg{background:#E7F3FB;color:#0088CC}
.ch-badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:600}
.scroll-hide::-webkit-scrollbar{width:6px;height:6px}
.scroll-hide::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D5DCDD;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb:hover{background:#B8C2C3}
.nav-item:hover .nav-icon{color:var(--sidebar-text)}
.nav-badge{margin-left:auto;background:var(--primary);color:#fff;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px}
.nav-badge.amber{background:var(--amber)}
.sidebar-bottom{margin-top:auto;padding:12px 14px;border-top:1px solid var(--sidebar-2)}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;cursor:pointer}
.user-pill:hover{background:var(--sidebar-2)}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;flex-shrink:0}
.avatar.lg{width:56px;height:56px;font-size:18px}
.avatar.sm{width:24px;height:24px;font-size:10px}
.user-name{color:#E5EEED;font-size:13px;font-weight:500}
.user-role{color:var(--sidebar-text-2);font-size:11px}

.crumbs{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;font-weight:500}
.crumbs .sep{color:var(--text-3)}
.crumbs .cur{color:var(--text);font-weight:600}
.search-box{flex:1;max-width:520px;margin:0 auto;position:relative}
.search-input{width:100%;height:36px;padding:0 12px 0 38px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;font-size:13px;outline:none;transition:all .15s}
.search-input:focus{background:#fff;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search-kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--surface);border:1px solid var(--border);padding:2px 6px;border-radius:5px;font-size:11px;color:var(--text-2);pointer-events:none}
.top-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:all .15s;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--surface)}

.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.4px}
.page-sub{color:var(--text-2);font-size:13.5px;margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2)}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-amber{background:var(--amber);color:#fff}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:7px}
.btn-xs{height:24px;padding:0 8px;font-size:11.5px;border-radius:6px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:18px}
.card-head{padding:16px 18px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title{font-weight:600;font-size:14.5px}
.card-sub{font-size:12px;color:var(--text-2);margin-top:2px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;line-height:1.5}
.b-green{background:var(--green-soft);color:#065F46}
.b-red{background:var(--red-soft);color:#991B1B}
.b-amber{background:var(--amber-soft);color:#92400E}
.b-blue{background:var(--blue-soft);color:#1E40AF}
.b-purple{background:var(--purple-soft);color:#5B21B6}
.b-gray{background:#F1F3F4;color:#475569}
.b-teal{background:var(--primary-soft);color:var(--primary-2)}
.b-gold{background:var(--gold-soft);color:#854D0E}

.kpi{padding:18px}
.kpi-label{font-size:12px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.kpi-value{font-size:26px;font-weight:700;letter-spacing:-.8px;line-height:1.1}
.kpi-delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;margin-top:6px}
.kpi-delta.up{color:var(--green)}
.kpi-delta.down{color:var(--red)}

table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--border-2);background:var(--surface-2)}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--border-2);font-size:13px;vertical-align:middle}
.tbl tr:hover td{background:var(--surface-2)}
.tbl tr.clickable{cursor:pointer}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-dash{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}

.heatmap{display:grid;grid-template-columns:140px repeat(7,1fr);gap:3px;font-size:11px}
.hm-h{padding:4px 6px;color:var(--text-3);text-align:center;font-weight:600;text-transform:uppercase}
.hm-l{padding:4px 6px;color:var(--text-3);font-weight:500;display:flex;align-items:center;font-size:11px}
.hm-c{aspect-ratio:1.2/1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:#fff}

.funnel{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.funnel-step{display:flex;align-items:center;gap:14px;padding:6px 0}
.funnel-bar{flex:1;background:var(--surface-2);border-radius:8px;height:36px;overflow:hidden}
.funnel-fill{height:100%;background:linear-gradient(90deg,var(--primary),#14B8A6);border-radius:8px;display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:600;font-size:12.5px}
.funnel-label{min-width:170px;font-size:13px;font-weight:500}
.funnel-conv{min-width:50px;font-size:12px;color:var(--text-2);text-align:right}

.sched-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.day-tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:3px}
.day-tab{padding:6px 14px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer}
.day-tab.active{background:var(--primary);color:#fff}
.day-tab:not(.active):hover{background:var(--surface-2);color:var(--text)}
.sched-grid{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.sched-head{display:grid;border-bottom:1px solid var(--border-2);background:var(--surface-2)}
.sched-head-cell{padding:11px 8px;text-align:center;border-right:1px solid var(--border-2);font-size:12px}
.sched-head-cell:last-child{border-right:none}
.doc-mini{display:flex;align-items:center;justify-content:center;gap:7px}
.doc-mini-name{font-weight:600;font-size:12.5px;color:var(--text);white-space:nowrap}
.doc-mini-spec{font-size:11px;color:var(--text-3);margin-top:1px}
.sched-body{position:relative;overflow:auto;max-height:calc(100vh - 280px)}
.sched-row{display:grid;border-bottom:1px solid var(--border-2);min-height:40px}
.sched-row:nth-child(odd){background:var(--surface-2)}
.sched-time{padding:8px;font-size:11.5px;color:var(--text-3);font-weight:500;border-right:1px solid var(--border-2);text-align:center}
.sched-cell{border-right:1px solid var(--border-2);position:relative;padding:2px;min-height:40px;cursor:pointer}
.sched-cell:last-child{border-right:none}
.sched-cell:hover{background:rgba(15,118,110,.07)}
.sched-cell--empty:hover::after{content:'+';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:300;color:var(--primary);opacity:.45;pointer-events:none;line-height:1}
.appt{position:absolute;left:3px;right:3px;border-radius:6px;padding:5px 7px;font-size:11.5px;color:#fff;cursor:pointer;overflow:hidden;border-left:3px solid rgba(0,0,0,.18);z-index:2;transition:all .12s}
.appt:hover{box-shadow:0 4px 12px rgba(0,0,0,.18);z-index:3}
.appt-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.appt-proc{font-size:10.5px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.appt-status{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.85}
.risk-dot{position:absolute;bottom:3px;right:5px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;font-size:10px;color:#DC2626;font-weight:700}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--text-3)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip-count{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:5px;font-size:11px;font-weight:600}
.chip.active .chip-count{background:rgba(255,255,255,.2)}
.patient-name{display:flex;align-items:center;gap:10px}
.patient-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.tbl tr:hover .patient-actions{opacity:1}

.pc-header{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;display:flex;align-items:center;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.pc-main{flex:1;min-width:260px}
.pc-name{font-size:21px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pc-meta{color:var(--text-2);font-size:13px;margin-top:5px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pc-meta-item{display:flex;align-items:center;gap:5px}
.pc-stats{display:flex;gap:10px}
.pc-stat{padding:10px 14px;background:var(--surface-2);border-radius:9px;text-align:center;min-width:90px}
.pc-stat-label{font-size:11px;color:var(--text-3);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.pc-stat-value{font-size:17px;font-weight:700;margin-top:3px;letter-spacing:-.3px}

.tabs{display:flex;gap:1px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:11px 16px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-badge{margin-left:6px;background:var(--surface-2);color:var(--text-2);padding:1px 6px;border-radius:5px;font-size:11px;font-weight:600}
.tab.active .tab-badge{background:var(--primary-soft);color:var(--primary-2)}

.teeth-wrap{background:linear-gradient(180deg,#FAFCFC,#FFFFFF);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 20px}
.teeth-legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;padding:10px 14px;background:var(--surface-2);border-radius:9px}
.tl-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);font-weight:500}
.tl-swatch{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.08)}
.teeth-row{display:flex;justify-content:center;gap:3px;margin-bottom:8px}
.teeth-half{display:flex;gap:3px}
.midline{width:2px;background:linear-gradient(180deg,transparent,var(--border) 20%,var(--border) 80%,transparent);margin:0 6px}
.tooth{cursor:pointer;transition:transform .15s,filter .15s}
.tooth:hover{transform:translateY(-2px);filter:drop-shadow(0 4px 6px rgba(15,118,110,.25))}
.tooth.selected{filter:drop-shadow(0 0 4px rgba(15,118,110,.6)) drop-shadow(0 4px 8px rgba(15,118,110,.3))}
.tooth-num{font-size:9px;text-anchor:middle;fill:var(--text-3);font-weight:600;pointer-events:none}
.tooth-seg{stroke:#94A3B8;stroke-width:.6}
.tooth-seg.healthy{fill:#FFFFFF}
.tooth-seg.caries{fill:#DC2626}
.tooth-seg.filling{fill:#94A3B8}
.tooth-seg.crown{fill:#CA8A04}
.tooth-seg.implant{fill:#2563EB}
.tooth-seg.endo{fill:#7C3AED}
.tooth-seg.bracket{fill:#0F766E}
.tooth-seg.retainer{fill:#2DD4BF}
.tooth-extracted{fill:none;stroke:#CBD5E1;stroke-width:1.5;stroke-dasharray:2 2}
.jaw-label{text-align:center;color:var(--text-3);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 4px}

.tp-head{padding:14px 16px;border-bottom:1px solid var(--border-2);display:flex;justify-content:space-between;align-items:center}
.tp-tooth{font-size:22px;font-weight:700;letter-spacing:-.5px}
.tp-tooth-name{font-size:11.5px;color:var(--text-2);margin-top:2px}
.tp-body{padding:12px 16px}
.tp-section{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);font-weight:600;margin-bottom:8px}
.tp-history-item{display:flex;gap:9px;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--border-2)}
.tp-history-item:last-child{border-bottom:none}
.tp-h-date{color:var(--text-3);font-size:11.5px;min-width:60px}

.timeline{position:relative;padding-left:30px}
.timeline::before{content:'';position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-event{position:relative;padding:8px 0 16px}
.tl-dot{position:absolute;left:-30px;top:10px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:2px solid var(--primary);color:var(--primary);box-shadow:0 0 0 4px var(--surface)}

.tl-desc{font-size:12.5px;color:var(--text-2);margin-top:5px}


.modal-bg{position:fixed;inset:0;background:rgba(15,31,30,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:var(--r-xl);box-shadow:0 24px 60px rgba(15,31,30,.25);max-width:700px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border-2);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-weight:600;font-size:16px}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border-2);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2)}
.mb-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-2);font-size:13px}
.mb-row:last-child{border:none}
.mb-row .lbl{color:var(--text-2)}
.mb-row .val{font-weight:600}

.cmdk-bg{position:fixed;inset:0;background:rgba(15,31,30,.6);display:none;align-items:flex-start;justify-content:center;z-index:200;padding-top:12vh}
.cmdk-bg.show{display:flex}
.cmdk{width:580px;max-width:90vw;background:var(--surface);border-radius:var(--r-xl);box-shadow:0 32px 80px rgba(15,31,30,.3);overflow:hidden}
.cmdk-search{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-2);gap:10px}
.cmdk-search input{flex:1;border:none;outline:none;font-size:16px;background:none}
.cmdk-results{max-height:420px;overflow-y:auto;padding:6px}
.cmdk-section{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;font-weight:600;padding:10px 12px 6px}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
.cmdk-item:hover,.cmdk-item.sel{background:var(--primary-tint)}

.ci-title{font-weight:500}
.ci-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.cmdk-foot{padding:9px 14px;border-top:1px solid var(--border-2);background:var(--surface-2);display:flex;gap:14px;font-size:11px;color:var(--text-3);align-items:center}
.cmdk-foot kbd{background:var(--surface);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-size:10.5px}

.notif-pop{position:absolute;top:46px;right:0;width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:60;display:none;overflow:hidden}

.notif-item{padding:11px 16px;border-bottom:1px solid var(--border-2);display:flex;gap:11px;cursor:pointer}
.notif-item:hover{background:var(--surface-2)}
.notif-item:last-child{border-bottom:none}

.ni-text{flex:1;font-size:13px}
.ni-meta{font-size:11.5px;color:var(--text-3);margin-top:3px}

.plan-row{display:grid;grid-template-columns:60px 1fr 110px 110px 110px 36px;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border-2);align-items:center;font-size:13px}
.plan-tooth{width:40px;height:40px;border-radius:8px;background:var(--primary-tint);color:var(--primary-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.plan-total{padding:14px 16px;background:var(--surface-2);display:flex;justify-content:space-between;font-weight:600;font-size:14px}

.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;width:100%;max-width:120px}
.bar-fill{height:100%;background:var(--primary);border-radius:3px}
.bar-fill.low{background:var(--red)}
.bar-fill.warn{background:var(--amber)}

.widget-preview{background:linear-gradient(180deg,#F0FDFA,#FAFCFC);border:1px solid var(--primary-soft);border-radius:var(--r-lg);padding:18px}

.wp-slot:hover{border-color:var(--primary);color:var(--primary)}

.mic-btn{display:flex;align-items:center;gap:12px;padding:14px 18px;width:100%;background:linear-gradient(135deg,var(--primary-tint),#fff);border:1px dashed var(--primary);border-radius:var(--r-lg);cursor:pointer}
.mic-btn:hover{background:var(--primary-soft)}
.mic-circle{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mic-btn.recording .mic-circle{background:var(--red);animation:pulseRed 1.4s infinite}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
.mic-wave{flex:1;display:flex;align-items:center;gap:3px;height:30px}
.mic-wave span{width:3px;background:var(--primary);border-radius:2px;opacity:.3;height:6px}
.mic-btn.recording .mic-wave span{opacity:1;animation:wave 1s infinite}
.mic-btn.recording .mic-wave span:nth-child(odd){animation-delay:.15s}
@keyframes wave{0%,100%{height:6px}50%{height:24px}}

.fin-tile{padding:16px 18px;border-radius:var(--r-lg);color:#fff}
.fin-t-1{background:linear-gradient(135deg,#0F766E,#14B8A6)}
.fin-t-2{background:linear-gradient(135deg,#D97706,#F59E0B)}

.fin-t-label{font-size:12px;opacity:.85;font-weight:500}
.fin-t-value{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.5px}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D5DCDD;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb:hover{background:#B8C2C3}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}

const APPOINTMENTS=(function(){
  const list=[];let id=1;
  const slots=['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00'];
  DOCTORS.forEach((doc,di)=>{
    for(let day=0;day<WEEK_DAYS.length;day++){
      const count=7+((di*3+day*5)%5);
      let cursor=0;
      for(let i=0;i<count && cursor<slots.length-2;i++){
        const start=slots[cursor];
        const dur=[30,30,45,60,60,90][i%6];
        const patient=PATIENTS[(di*5+day*3+i*7)%PATIENTS.length];
        let proc=PROCEDURES[(di+day+i)%PROCEDURES.length];
        if(doc.spec.includes('Хирург'))proc=PROCEDURES[6+(i%3)];
        else if(doc.spec.includes('Ортодонт'))proc=PROCEDURES[12+(i%2)];
        else if(doc.spec.includes('Гигиенист'))proc=PROCEDURES[1];
        else if(doc.spec.includes('Детский'))proc=PROCEDURES[15];
        else if(doc.spec.includes('Ортопед'))proc=PROCEDURES[9+(i%3)];
        else if(doc.spec.includes('Эндодонт'))proc=PROCEDURES[4+(i%2)];
        else proc=PROCEDURES[2+(i%2)];
        const statuses=['confirmed','pending','confirmed','done','confirmed','noshow','confirmed'];
        const status=day<4?'done':(day===4&&parseInt(start)<11?'done':(day===4?(i%5===0?'pending':'confirmed'):statuses[i%6]));
        list.push({id:'a'+id++,day,start,dur,docId:doc.id,patientId:patient.id,procName:proc.n,procPrice:proc.p,procType:proc.t,status,risk:patient.risk||0.2});
        cursor+=Math.ceil(dur/30)+(i%4===0?1:0);
      }
    }
  });
  return list;
})();

const fmt={
money:v=>{if(v==null||isNaN(v))return'— ₼';const a=Math.abs(v);return (v<0?'-':'')+a.toLocaleString('ru-RU').replace(/,/g,' ')+' ₼'},
date:s=>{if(!s)return'—';const d=new Date(s);return isNaN(d)?'—':d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short'})},
dateFull:s=>{if(!s)return'—';const d=new Date(s);return isNaN(d)?'—':d.toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'})},
age:a=>{const l=a%10,lt=a%100;if(lt>=11&&lt<=14)return a+' лет';if(l===1)return a+' год';if(l>=2&&l<=4)return a+' года';return a+' лет'}};
function $(id){return document.getElementById(id)}
function patient(id){return (STATE._patientsCache&&STATE._patientsCache[id])||PATIENTS.find(p=>p.id===id)}
function doctor(id){return DOCTORS.find(d=>d.id===id)}
function escapeHTML(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ini(name){return name.split(' ').map(s=>s[0]).slice(0,2).join('')}
const TAG_LABEL={all:'Все',active:'Активные',sleeping:'Спящие 6+ мес',debtor:'Должники',vip:'VIP',new:'Новые'};
function tagBadge(t){const map={vip:'b-gold',active:'b-green',sleeping:'b-gray',debtor:'b-red',new:'b-blue'};const lbl={vip:'VIP',active:'Активный',sleeping:'Спящий',debtor:'Должник',new:'Новый'};return `<span class="badge ${map[t]||'b-gray'}">${lbl[t]||t}</span>`}
function statusBadge(s){const m={confirmed:['b-green','Подтверждена'],pending:['b-amber','Ждём'],inchair:['b-blue','В кресле'],done:['b-gray','Завершён'],noshow:['b-red','Не пришёл']};const[c,l]=m[s]||['b-gray',s];return `<span class="badge ${c}">${l}</span>`}

/* ===== NAVIGATION ===== */
async function setView(v,extra,_skipPush){
  // Проверка прав доступа к разделу
  const _sectionViews=['dashboard','schedule','patients','treatment','finance','inventory','writeoff','comms','analytics','team','settings'];
  if(_sectionViews.includes(v)&&!getUserSections().includes(v)){
    $('content').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;gap:14px;color:var(--text-3)"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg><div style="font-size:15px;font-weight:600;color:var(--text-2)">Доступ запрещён</div><div style="font-size:13px">У вашей роли нет доступа к этому разделу</div></div>`;
    return;
  }
  STATE.view=v;
  if(extra)Object.assign(STATE,extra);
  if(!_skipPush){const _h=v==='patient'&&STATE.patientId?`patient/${STATE.patientId}/${STATE.patientTab||'overview'}`:v;history.pushState(null,'','#'+_h);}
  if(v==='patients'||v==='dashboard'||v==='schedule'||v==='treatment'||v==='finance'||v==='inventory'||v==='writeoff'||v==='comms'||v==='analytics'||v==='team'){
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
  }
  if(API.token()&&(v==='dashboard'||v==='patients'||v==='schedule'||v==='patient'||v==='finance'||v==='treatment'||v==='inventory'||v==='writeoff'||v==='comms'||v==='analytics'||v==='team')){
    $('content').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-3)"><svg class="spin" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg></div>';
    try{
      if(v==='dashboard')await loadDashboard();
      else if(v==='finance')await loadFinanceClinic();
      else if(v==='inventory')await loadInventory();
      else if(v==='writeoff')await loadWriteoff();
      else if(v==='comms')await loadCommsClinic();
      else if(v==='analytics')await loadAnalytics();
      else if(v==='team')await loadTeam();
      else if(v==='treatment')await loadTreatment();
      else if(v==='patients')await loadPatients();
      else if(v==='schedule')await loadSchedule();
      else if(v==='patient'&&STATE.patientId){await loadPatient(STATE.patientId);await loadPatientTimeline(STATE.patientId);}
    }catch(e){console.error('load error',e);}
  }
  render();
}
const CRUMBS={dashboard:'Дашборд',schedule:'Расписание',patients:'Пациенты',treatment:'Лечение',finance:'Финансы',inventory:'Склад',writeoff:'Списание',comms:'Коммуникации',analytics:'Аналитика',team:'Команда и роли',settings:'Настройки'};
function renderCrumbs(){
  let html='<span>Главная</span><span class="sep">/</span>';
  if(STATE.view==='patient'){
    html+=`<span style="cursor:pointer" onclick="setView('patients')">Пациенты</span><span class="sep">/</span><span class="cur">${patient(STATE.patientId).name}</span>`;
  } else {
    html+=`<span class="cur">${CRUMBS[STATE.view]||''}</span>`;
  }
  $('crumbs').innerHTML=html;
}
function render(){
  renderCrumbs();
  const v=STATE.view;
  let html='';
  if(v==='dashboard')html=renderDashboard();
  else if(v==='schedule')html=renderSchedule();
  else if(v==='patients')html=renderPatients();
  else if(v==='patient')html=renderPatient();
  else if(v==='treatment')html=renderTreatment();
  else if(v==='finance')html=renderFinance();
  else if(v==='inventory')html=renderInventory();
  else if(v==='writeoff')html=renderWriteoff();
  else if(v==='comms')html=renderComms();
  else if(v==='analytics')html=renderAnalytics();
  else if(v==='team')html=renderTeam();
  else if(v==='settings')html=renderSettings();
  $('content').innerHTML=html;
  if(v==='patient')bindPatientTabs();
}

/* ===== DASHBOARD ===== */
function renderDashboard(){
  const d=STATE._dashData;
  const kpi=d&&d.kpi||{};
  const inClinic=d&&d.inClinic||[];
  const topDocs=d&&d.topDoctors||[];
  const revByDay=d&&d.revenueByDay||[];

  const todayAppts=APPOINTMENTS.filter(a=>a.day===STATE.scheduleDay&&(a.weekOffset||0)===(STATE.scheduleWeekOffset||0));
  const todayCount=kpi.todayCount!=null?kpi.todayCount:todayAppts.length;
  const chairLoad=kpi.chairLoadPct!=null?kpi.chairLoadPct:0;
  const revMonth=kpi.revenueMonth||0;
  const avgCheck=kpi.avgCheck||0;
  const newPatients=kpi.newPatientsMonth!=null?kpi.newPatientsMonth:0;
  const newDelta=kpi.newPatientsDelta||0;
  const revDelta=kpi.revDelta!=null?kpi.revDelta:null;

  const u=JSON.parse(localStorage.getItem('dentaly_user')||'{}');
  const uFirst=(u.fullName||'Коллега').split(' ')[0];
  const hr=new Date().getHours();
  const greet=hr<12?'Доброе утро':hr<17?'Добрый день':'Добрый вечер';
  const todayLabel=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});

  const spark=revByDay.length>0?revByDay.map(x=>x.amount):[12,18,15,22,28,19,24,32,29,35,31,38,42,46];
  const funnel=[
    {l:'Лиды (звонки/заявки)',v:482,bar:100},
    {l:'Запись на приём',v:341,bar:71},
    {l:'Состоявшийся визит',v:298,bar:62},
    {l:'Согласован план',v:187,bar:39},
    {l:'Оплата 1-го этапа',v:156,bar:32},
    {l:'Повторный визит',v:134,bar:28}];

  const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const docs=DOCTORS.length?DOCTORS:[{ini:'—',spec:'',load:0,name:''}];
  let heat='<div class="heatmap"><div></div>';
  days.forEach(dy=>heat+=`<div class="hm-h">${dy}</div>`);
  docs.forEach(doc=>{
    heat+=`<div class="hm-l">${doc.ini} · ${(doc.spec||'').slice(0,14)}</div>`;
    for(let i=0;i<7;i++){
      const v=i===6?20+((doc.load+i*7)%30):40+((doc.load+i*11)%55);
      const op=Math.max(.15,Math.min(1,v/100));
      heat+=`<div class="hm-c" style="background:rgba(15,118,110,${op})" title="${doc.name} · ${days[i]}: ${v}%">${v}</div>`;
    }
  });
  heat+='</div>';

  const areaPath=(()=>{
    const w=600,h=160,pad=20;
    const mx=Math.max(...spark,1);
    const mn=Math.min(...spark);
    const rng=Math.max(mx-mn,1);
    const pts=spark.map((v,i)=>[(i/(spark.length-1))*(w-pad*2)+pad,h-((v-mn)/rng)*(h-30)+10]);
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${h+10} L${pts[0][0].toFixed(1)} ${h+10} Z`;
    const circles=pts.filter((_,i)=>spark[i]>0).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#0F766E"/>`).join('');
    return `<path d="${area}" fill="url(#g1)"/><path d="${line}" stroke="#0F766E" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${circles}`;
  })();

  const revDeltaHtml=revDelta!=null
    ?`<div class="kpi-delta ${revDelta>=0?'up':'down'}">${revDelta>=0?I.trend:I.trendDn} ${revDelta>=0?'+':''}${revDelta.toFixed(1)}% к прошлому месяцу</div>`
    :`<div class="kpi-delta" style="color:var(--text-3)">нет данных за пред. месяц</div>`;

  const mName=new Date().toLocaleDateString('ru-RU',{month:'long'});

  const inClinicHtml=inClinic.length>0
    ?inClinic.map(r=>{
        const parts=r.doctorName.split(' ');
        const docShort=(parts[1]||'')+' '+(parts[0]?parts[0][0]+'.':'');
        const elapsed=Math.round((Date.now()-r.startsAt)/60000);
        return `<div style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border-2)"><div class="avatar sm" style="background:${r.color}">${r.initials}</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${r.patientName}</div><div style="font-size:11.5px;color:var(--text-2);margin-top:1px">${r.procName} · ${docShort}</div></div><div style="text-align:right"><div style="font-size:11px;color:var(--text-3);font-weight:500">${r.chairName||''}</div><div style="font-size:11px;color:var(--green);font-weight:600;margin-top:1px">⦿ ${elapsed>0?elapsed+' мин':'сейчас'}</div></div></div>`;
      }).join('')
    :`<div style="padding:24px 16px;text-align:center;color:var(--text-3);font-size:13px">Нет активных приёмов</div>`;

  const topDocsHtml=topDocs.length>0
    ?topDocs.map((doc,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 18px"><div style="color:var(--text-3);font-weight:700;width:18px;font-size:13px">${i+1}</div><div class="avatar sm" style="background:${doc.color}">${doc.initials}</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px">${doc.name}</div><div style="font-size:11px;color:var(--text-3)">${doc.specialty}</div></div><div style="text-align:right"><div style="font-weight:700;font-size:13px">${fmt.money(doc.revMonth)}</div><div style="font-size:11px;color:var(--text-3)">${doc.appts} приём${doc.appts===1?'':doc.appts<5?'а':'ов'}</div></div></div>`).join('')
    :DOCTORS.slice(0,5).map((doc,i)=>{const rev=(8-i)*340000+i*120000;const pct=85-i*8;return `<div style="display:flex;align-items:center;gap:10px;padding:9px 18px"><div style="color:var(--text-3);font-weight:700;width:18px;font-size:13px">${i+1}</div><div class="avatar sm" style="background:${doc.c}">${doc.ini}</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px">${doc.name}</div><div style="font-size:11px;color:var(--text-3)">${doc.spec}</div></div><div style="text-align:right"><div style="font-weight:700;font-size:13px">${fmt.money(rev)}</div><div style="font-size:11px;color:var(--text-3)">${pct}% загрузка</div></div></div>`}).join('');

  return `
  <div class="page-head">
    <div>
      <div class="page-title">${greet}, ${uFirst} 👋</div>
      <div class="page-sub">${todayLabel} · сегодня ${todayCount} записей · загрузка кресел ${chairLoad}%</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost">${I.download}Экспорт отчёта</button>
      <button class="btn btn-primary" onclick="openModal('newAppt')">${I.plus}Новая запись</button>
    </div>
  </div>
  <div class="grid-4">
    <div class="card kpi"><div class="kpi-label">Выручка за ${mName}</div><div class="kpi-value">${fmt.money(revMonth)}</div>${revDeltaHtml}</div>
    <div class="card kpi"><div class="kpi-label">Средний чек визита</div><div class="kpi-value">${fmt.money(avgCheck)}</div><div class="kpi-delta up">${I.trend} данные за текущий месяц</div></div>
    <div class="card kpi"><div class="kpi-label">Загрузка кресел</div><div class="kpi-value">${chairLoad}%</div><div class="kpi-delta ${chairLoad>50?'up':'down'}">${chairLoad>50?I.trend:I.trendDn} ${todayCount} записей сегодня</div></div>
    <div class="card kpi"><div class="kpi-label">Новых пациентов</div><div class="kpi-value">${newPatients}</div><div class="kpi-delta ${newDelta>=0?'up':'down'}">${newDelta>=0?I.trend:I.trendDn} ${newDelta>=0?'+':''}${newDelta} к прошлому месяцу</div></div>
  </div>
  <div class="grid-dash">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">Выручка по дням</div><div class="card-sub">Последние 14 дней</div></div>
          <div style="display:flex;gap:6px"><button class="btn btn-ghost btn-sm">14Д</button><button class="btn btn-ghost btn-sm" style="opacity:.5">30Д</button><button class="btn btn-ghost btn-sm" style="opacity:.5">90Д</button></div>
        </div>
        <div style="padding:18px">
          <svg viewBox="0 0 600 180" style="width:100%;height:180px">
            <defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0F766E" stop-opacity=".25"/><stop offset="100%" stop-color="#0F766E" stop-opacity="0"/></linearGradient></defs>
            <line x1="0" x2="600" y1="30" y2="30" stroke="#EEF1F2"/><line x1="0" x2="600" y1="70" y2="70" stroke="#EEF1F2"/><line x1="0" x2="600" y1="110" y2="110" stroke="#EEF1F2"/><line x1="0" x2="600" y1="150" y2="150" stroke="#EEF1F2"/>
            ${areaPath}

        <div class="card-head">
          <div><div class="card-title">Воронка пациентов</div><div class="card-sub">От лида до повторного визита</div></div>

/* ===== SCHEDULE ===== */
function renderSchedule(){
  const slots=[];
  for(let h=9;h<20;h++){slots.push(h+':00');slots.push(h+':30')}
  slots.forEach((s,i)=>slots[i]=s.padStart(5,'0'));
  const dayAppts=APPOINTMENTS.filter(a=>a.day===STATE.scheduleDay&&(a.weekOffset||0)===(STATE.scheduleWeekOffset||0));
  const schedDocs=(STATE._schedDoctors&&STATE._schedDoctors[STATE.scheduleDay])||DOCTORS;
  const cols=`60px repeat(${schedDocs.length},minmax(120px,1fr))`;
  let head=`<div class="sched-head" style="grid-template-columns:${cols}"><div class="sched-head-cell" style="background:var(--surface-2)"></div>`;
  schedDocs.forEach(d=>{
    head+=`<div class="sched-head-cell"><div class="doc-mini"><div class="avatar sm" style="background:${d.c}">${d.ini}</div><div style="text-align:left;min-width:0"><div class="doc-mini-name">${d.name.split(' ')[0]} ${(d.name.split(' ')[1]||'')[0]||''}.</div><div class="doc-mini-spec">${d.spec}</div></div></div></div>`;
  });
  head+='</div>';
  let body='';
  slots.forEach(slot=>{
    body+=`<div class="sched-row" style="grid-template-columns:${cols}"><div class="sched-time">${slot}</div>`;
    schedDocs.forEach(doc=>{
      const cellAppts=dayAppts.filter(a=>a.docId===doc.id && a.start===slot);
      let inner='';
      cellAppts.forEach(a=>{
        const p=patient(a.patientId);
        const c=(PROC_TYPES[a.procType]||PROC_TYPES.ther).c;
        const h=(a.dur/30)*40-6;
        const highRisk=a.risk>0.6;
        inner+=`<div class="appt" style="background:${c};top:2px;height:${h}px" onclick="event.stopPropagation();openApptModal('${a.id}')"><div class="appt-status" style="background:${a.status==='done'?'#fff':a.status==='pending'?'#FCD34D':a.status==='noshow'?'#FCA5A5':'#fff'}"></div><div class="appt-name">${p?p.name:'Пациент'}</div><div class="appt-proc">${a.procName}</div>${highRisk?`<div class="risk-dot" title="Высокий риск ${Math.round(a.risk*100)}%">⚠</div>`:''}</div>`;
      });
      const isEmpty=cellAppts.length===0;
      body+=`<div class="sched-cell${isEmpty?' sched-cell--empty':''}" onclick="openModal('newAppt',{time:'${slot}',docId:'${doc.id}',date:'${getWeekDate(STATE.scheduleDay)}'});event.stopPropagation()">${inner}</div>`;
    });
    body+='</div>';
  });
  const load=schedDocs.length?Math.min(Math.round((dayAppts.length/(schedDocs.length*10))*100),99):0;
  return `
  <div class="page-head">
    <div><div class="page-title">Расписание</div><div class="page-sub">${dayAppts.length} записей · ${WEEK_DAYS[STATE.scheduleDay]} · загрузка ${load}%</div></div>
    <div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="openModal('newAppt')">${I.plus}Записать</button></div>
  </div>
  <div class="sched-toolbar">
    <div style="display:flex;align-items:center;gap:6px">
      <button class="btn btn-ghost btn-sm" onclick="goScheduleWeek(-1)" title="Предыдущая неделя">←</button>
      <span style="font-size:12.5px;font-weight:600;color:var(--text-2);min-width:90px;text-align:center">${scheduleWeekLabel()}</span>
      <button class="btn btn-ghost btn-sm" onclick="goScheduleWeek(1)" title="Следующая неделя">→</button>
      <button class="btn btn-ghost btn-sm" onclick="STATE.scheduleWeekOffset=0;loadSchedule().then(render)" style="font-size:11px">Сегодня</button>
      <input type="date" style="height:30px;padding:0 8px;border:1px solid var(--border);border-radius:7px;font-size:12px;color:var(--text);background:#fff;cursor:pointer" value="${getWeekDate(STATE.scheduleDay)}" onchange="goScheduleDate(this.value)" title="Перейти к дате">
    </div>
    <div class="day-tabs">${WEEK_DAYS.map((d,i)=>`<div class="day-tab ${i===STATE.scheduleDay?'active':''}" onclick="setView('schedule',{scheduleDay:${i}})">${d}</div>`).join('')}</div>
  </div>
  <div class="sched-grid">${head}<div class="sched-body">${body}</div></div>`;
}

async function updateApptStatus(apptId,status){
  const a=APPOINTMENTS.find(x=>x.id===apptId);
  try{
    await API.patch('/api/appointments/'+apptId,{status});
    if(a)a.status=status;
    toast('Статус обновлён');
    if(STATE.view==='schedule')render();
  }catch(e){toast('Ошибка: '+(e.message||'не удалось обновить статус'));}
}

async function deleteAppt(apptId){
  if(!confirm('Удалить запись? Данные будут удалены из базы безвозвратно.'))return;
  try{
    const res=await API.req('DELETE','/api/appointments/'+apptId);
    if(!res)return;
    const idx=APPOINTMENTS.findIndex(x=>x.id===apptId);
    if(idx!==-1)APPOINTMENTS.splice(idx,1);
    closeModal();
    toast('Запись удалена');
    render();
  }catch(e){
    toast('Ошибка: '+(e.message||'не удалось удалить запись'));
  }
}

async function deletePatient(id){
  const p=patient(id);
  if(!confirm('Удалить пациента '+(p?p.name:'')+`?\n\nВсе данные (визиты, планы лечения, документы) будут удалены безвозвратно.`))return;
  try{
    if(API.token()){
      const res=await API.req('DELETE','/api/patients/'+id);
      if(!res)return;
    }
    const idx=PATIENTS.findIndex(x=>x.id===id);
    if(idx!==-1)PATIENTS.splice(idx,1);
    toast('Пациент удалён');
    render();
  }catch(e){
    toast('Ошибка: '+(e.message||'не удалось удалить пациента'));
  }
}
function openEditApptModal(apptId){
  const a=APPOINTMENTS.find(x=>x.id===apptId);if(!a)return;
  // Формируем ISO дату и время из startsAt
  const dt=new Date(a.startsAt||Date.now());
  const ALM=5*3600000;
  const isoDate=new Date(dt.getTime()+ALM).toISOString().slice(0,10);
  const isoTime=new Date(dt.getTime()+ALM).toISOString().slice(11,16);
  MODAL_STATE={type:'editAppt',ctx:{apptId},data:{
    docId:a.docId,procIdx:PROCEDURES.findIndex(p=>p.n===a.procName)||0,
    date:isoDate,time:isoTime,dur:a.dur||60
  }};
  renderModal();
  $('modalBg').classList.add('show');
}


async function submitEditAppt(apptId){
  const d=MODAL_STATE.data;
  let date=d.date;
  if(/^\d{2}\.\d{2}\.\d{4}$/.test(date)){const[dd,mm,yyyy]=date.split('.');date=`${yyyy}-${mm}-${dd}`;}
  const startsAt=new Date(date+'T'+d.time+':00+05:00').getTime();
  if(isNaN(startsAt)){toast('Неверная дата или время');return;}
  const proc=PROCEDURES[d.procIdx||0];
  try{
    const res=await API.patch('/api/appointments/'+apptId,{
      startsAt,durationMin:d.dur,doctorId:d.docId,
      ...(proc?{procedureId:proc.id}:{})
    });
    if(!res)return;
    closeModal();
    toast('Запись обновлена');
    await loadSchedule();render();
  }catch(e){
    toast('Ошибка: '+(e.message||'не удалось обновить запись'));
  }
}

  if(tab==='comms')return renderTabComms(p);
  return '';
}

/* ===== TEETH CHART (WOW FEATURE) ===== */
function renderTabTeeth(p){
  const data=(STATE._teethData&&STATE._teethData[p.id])||{};
  function renderTooth(num){
    const cond=data[num]||{};
    const isFront=(num%10>=1 && num%10<=3);
    const isUpper=num<30;
    const w=28,h=isFront?44:38;
    let segments='';
    if(cond.state==='extracted'){
      segments=`<rect class="tooth-extracted" x="3" y="3" width="${w-6}" height="${h-6}" rx="6"/>`;
    } else if(cond.state==='implant'){
      const bc='#2563EB';
      segments=`<rect x="4" y="${isUpper?h-14:4}" width="${w-8}" height="10" rx="3" fill="${bc}"/><path d="M${w/2-3} ${isUpper?h-14:14} L${w/2} ${isUpper?h-22:6} L${w/2+3} ${isUpper?h-14:14}" stroke="${bc}" stroke-width="2.5" fill="none"/><line x1="${w/2}" y1="${isUpper?h-12:6}" x2="${w/2}" y2="${isUpper?h-4:14}" stroke="${bc}" stroke-width="1.5" stroke-dasharray="2 2"/>`;
    } else if(cond.state==='crown'){
      segments=`<rect class="tooth-seg crown" x="3" y="3" width="${w-6}" height="${h-6}" rx="5"/><path d="M6 ${h/2} L${w/2-3} ${h/2-3} L${w/2} ${h/2+3} L${w/2+3} ${h/2-3} L${w-6} ${h/2}" stroke="#854D0E" stroke-width=".8" fill="none" opacity=".5"/>`;
    } else {
      const seg=cond.seg||{};
      const s=(k)=>seg[k]||'healthy';
      const fdiOnRight=(num>=11&&num<=18)||(num>=41&&num<=48);
      const M_side=fdiOnRight?'left':'right';
      const D_side=fdiOnRight?'right':'left';
      const V_side=isUpper?'top':'bottom';
      const L_side=isUpper?'bottom':'top';
      const segOf=(side)=>{if(side===M_side)return s('m');if(side===D_side)return s('d');if(side===V_side)return s('v');if(side===L_side)return s('l');};
      segments=`<path class="tooth-seg ${segOf('top')}" d="M3 ${h*.32} Q3 3 ${w/2} 3 Q${w-3} 3 ${w-3} ${h*.32} L${w*.7} ${h*.45} L${w*.3} ${h*.45} Z"/><path class="tooth-seg ${segOf('bottom')}" d="M3 ${h*.68} Q3 ${h-3} ${w/2} ${h-3} Q${w-3} ${h-3} ${w-3} ${h*.68} L${w*.7} ${h*.55} L${w*.3} ${h*.55} Z"/><path class="tooth-seg ${segOf('left')}" d="M3 ${h*.32} L${w*.3} ${h*.45} L${w*.3} ${h*.55} L3 ${h*.68} Z"/><path class="tooth-seg ${segOf('right')}" d="M${w-3} ${h*.32} L${w*.7} ${h*.45} L${w*.7} ${h*.55} L${w-3} ${h*.68} Z"/>${isFront?'':`<rect class="tooth-seg ${s('o')}" x="${w*.3}" y="${h*.45}" width="${w*.4}" height="${h*.1}"/>`}`;
    }
    return `<svg class="tooth ${STATE.selectedTooth===num?'selected':''}" width="${w}" height="${h+12}" overflow="visible" data-tooth="${num}" onclick="selectTooth(${num})" style="display:inline-block"><text class="tooth-num" x="${w/2}" y="${isUpper?h+10:10}">${num}</text><g transform="translate(0,${isUpper?0:12})">${segments}</g></svg>`;
  }
  function renderRow(left,right){
    return `<div class="teeth-row"><div class="teeth-half right">${left.map(renderTooth).join('')}</div><div class="midline"></div><div class="teeth-half">${right.map(renderTooth).join('')}</div></div>`;
  }
  const conditions=Object.values(data);
  const stats={
    caries:conditions.filter(c=>c.seg&&Object.values(c.seg).includes('caries')).length,
    filling:conditions.filter(c=>c.seg&&Object.values(c.seg).includes('filling')).length,
    crown:conditions.filter(c=>c.state==='crown').length,
    implant:conditions.filter(c=>c.state==='implant').length,
    extracted:conditions.filter(c=>c.state==='extracted').length
  };
  const selectedHistory=STATE.selectedTooth?((STATE._toothHistory&&STATE._toothHistory[p.id]||{})[STATE.selectedTooth]||[]):[];
  return `
  <div class="grid-2" style="grid-template-columns:1fr 320px">
    <div class="teeth-wrap">
      <div class="teeth-legend">
        <div class="tl-item"><div class="tl-swatch" style="background:#fff"></div>Здоровый</div>
        <div class="tl-item"><div class="tl-swatch" style="background:#0F766E"></div>Брекет</div>
        <div class="tl-item"><div class="tl-swatch" style="background:#2DD4BF"></div>Ретейнер</div>
        <div class="tl-item"><div class="tl-swatch" style="background:#94A3B8"></div>Пломба</div>
        <div class="tl-item"><div class="tl-swatch" style="background:#CA8A04"></div>Коронка</div>
        <div class="tl-item"><div class="tl-swatch" style="background:#2563EB"></div>Имплант</div>
        <div class="tl-item"><div class="tl-swatch" style="background:transparent;border-style:dashed"></div>Удалён</div>
      </div>
      <div class="jaw-label">Верхняя челюсть</div>
      ${renderRow([18,17,16,15,14,13,12,11],[21,22,23,24,25,26,27,28])}
      <div class="jaw-label">Нижняя челюсть</div>
      ${renderRow([48,47,46,45,44,43,42,41],[31,32,33,34,35,36,37,38])}
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border-2)">
      ${[{n:stats.caries,l:'Кариес',c:'#DC2626'},{n:stats.filling,l:'Пломбы',c:'#94A3B8'},{n:stats.crown,l:'Коронки',c:'#CA8A04'},{n:stats.implant,l:'Импланты',c:'#2563EB'},{n:stats.extracted,l:'Удалены',c:'#94A3B8'}].map(s=>`<div style="text-align:center"><div style="font-size:22px;font-weight:700;color:${s.c}">${s.n}</div><div style="font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-top:2px">${s.l}</div></div>`).join('')}
      </div>
    </div>
    <div class="card" style="align-self:start">
    ${STATE.selectedTooth?`
      <div class="tp-head">
        <div><div class="tp-tooth">Зуб ${STATE.selectedTooth}</div><div class="tp-tooth-name">${toothName(STATE.selectedTooth)}</div></div>
        <div class="badge ${condBadgeClass(data[STATE.selectedTooth])}">${conditionLabel(data[STATE.selectedTooth])}</div>
      </div>
      <div class="tp-body">
        <div class="tp-section">История зуба</div>
        ${selectedHistory.length?selectedHistory.map(h=>`<div class="tp-history-item"><div class="tp-h-date">${fmt.date(h.d)}</div><div class="tp-h-text">${h.t}</div></div>`).join(''):'<div style="font-size:12px;color:var(--text-3);padding:6px 0">Без записей. Зуб без замечаний.</div>'}
        <div style="display:flex;gap:6px;margin-top:14px">
          ${(()=>{const c=data[STATE.selectedTooth];const has=c&&(c.state||c.seg);return has?`<button class="btn btn-primary btn-sm" style="flex:1;justify-content:center" onclick="openModal('toothProc')">${I.edit}Изменить</button><button class="btn btn-ghost btn-sm" style="color:var(--red);border-color:var(--red)20" onclick="deleteToothState()">${I.trash}Удалить</button>`:`<button class="btn btn-primary btn-sm" style="flex:1;justify-content:center" onclick="openModal('toothProc')">${I.plus}Процедура</button>`})()}
          <button class="btn btn-ghost btn-sm">${I.doc}</button>
        </div>
      </div>`:`
      <div class="card-head"><div class="card-title">Зуб не выбран</div></div>
      <div class="card-pad" style="text-align:center;padding:36px 18px;color:var(--text-3);font-size:13px">${I.tooth}<div style="margin-top:10px">Кликните на зуб,<br>чтобы увидеть детали</div></div>`}
    </div>
  </div>`;
}

function toothName(num){
  const pos=num%10;
  const names=['','Центральный резец','Боковой резец','Клык','1-й премоляр','2-й премоляр','1-й моляр','2-й моляр','Зуб мудрости'];
  const jaw=num<30?'верх':'низ';
  const side=(num>=11&&num<=18)||(num>=41&&num<=48)?'право':'лево';
  return `${names[pos]} · ${jaw} ${side}`;
}
function condBadgeClass(c){
  if(!c)return 'b-green';
  if(c.state==='extracted')return 'b-gray';
  if(c.state==='implant')return 'b-blue';
  if(c.state==='crown')return 'b-gold';
  if(c.seg&&Object.values(c.seg).includes('caries'))return 'b-red';
  return 'b-teal';
}
function conditionLabel(c){
  if(!c)return 'Здоров';
  if(c.state==='extracted')return 'Удалён';
  if(c.state==='implant')return 'Имплант';
  if(c.state==='crown')return 'Коронка';
  if(c.state==='endo')return 'Эндо-лечение';
  if(c.seg){const types=[...new Set(Object.values(c.seg))];return types.map(t=>({caries:'Кариес',filling:'Пломба'})[t]||t).join(', ')}
  return 'Норма';
}
function selectTooth(num){
  STATE.selectedTooth=num;
  $('pcTabContent').innerHTML=renderPatientTab(patient(STATE.patientId),'teeth');
}

async function switchVariant(pid,key){
  if(!STATE._planData||!STATE._planData[pid])return;
  const planId=STATE._planData[pid].id;
  STATE._planData[pid].activeVariant=key;
  $('pcTabContent').innerHTML=renderPatientTab(patient(pid),'plan');
  toast(`Активный вариант: ${STATE._planData[pid].variants[key].name}`);
  await API.req('PATCH','/api/plans/'+planId,{activeVariant:key});
}

function bookVisit(vid){
  const plan=STATE._planData&&STATE._planData[STATE.patientId];
  const v=plan&&plan.visits.find(x=>x.id===vid);
  if(!v)return;
  toast(`Открыта запись пациента на «${v.title}» — ${fmt.dateFull(v.date)}`);
  openModal('newAppt',{visitId:vid});
}

async function removeStage(pid,vid,sid){
  if(!confirm('Удалить процедуру из плана?'))return;
  const plan=STATE._planData&&STATE._planData[pid];if(!plan)return;
  const res=await API.req('DELETE','/api/plans/'+plan.id+'/stages/'+sid);
  if(!res)return;
  const planData=await API.get('/api/patients/'+pid+'/plan');
  if(planData&&planData.plan)STATE._planData[pid]=planData.plan;
  $('pcTabContent').innerHTML=renderPatientTab(patient(pid),'plan');
  toast('Процедура удалена из плана');
}

function sendTreatmentOffer(pid){
  toast('Предложение отправлено в WhatsApp и Telegram');
}

// Toast helper
function toast(msg){
  let t=document.getElementById('__toast');
  if(!t){t=document.createElement('div');t.id='__toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0F1F1E;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:300;opacity:0;transition:opacity .2s,transform .2s';document.body.appendChild(t);}
  t.textContent=msg;
  t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(window.__toastT);
  window.__toastT=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(8px)'},2400);
}

async function editProcedureInline(id){
  const pr=PROCEDURES.find(p=>p.id===id);if(!pr)return;
  const newPrice=prompt(`Новая цена для «${pr.n}» (сейчас ${fmt.money(pr.p)}):`,pr.p);
  if(!newPrice||isNaN(parseInt(newPrice)))return;
  const price=parseInt(newPrice);
  if(price<=0){toast('Цена должна быть больше 0');return;}
  const res=await API.req('PATCH','/api/procedures/'+id,{price});
  if(!res)return;
  pr.p=price;
  pr.margin=pr.cost>0?Math.round(((price-pr.cost)/price)*100):0;
  toast(`Цена обновлена: ${fmt.money(price)}`);
  render();
}

async function openOrderModal(id,name,deficit){
  if(!confirm(`Зафиксировать заказ: «${name}» · ${deficit} ед.?`))return;
  const res=await API.post('/api/inventory/'+id+'/order',{qty:deficit});
  if(!res)return;
  STATE._pendingOrders.push({uid:crypto.randomUUID(),itemId:id,name,qty:res.qty||deficit,createdAt:Date.now(),status:'pending'});
  localStorage.setItem('dentaly_orders',JSON.stringify(STATE._pendingOrders));
  toast(`Заказ оформлен · ${name} · +${res.qty||deficit} ед.`);
  const data=await API.get('/api/inventory');
  if(data)STATE._inventoryData=data;
  render();
}
async function cancelInventoryOrder(uid,itemId,qty){
  if(!confirm('Отменить заказ? Количество будет убрано из остатка.'))return;
  try{
    await API.post('/api/inventory/movements',{itemId,kind:'out',qty,reason:'Отмена заказа'});
  }catch(e){toast('Ошибка: '+(e.message||'не удалось отменить'));return;}
  const idx=STATE._pendingOrders.findIndex(o=>o.uid===uid);
  if(idx!==-1)STATE._pendingOrders[idx].status='cancelled';
  localStorage.setItem('dentaly_orders',JSON.stringify(STATE._pendingOrders));
  toast('Заказ отменён');
  const data=await API.get('/api/inventory');
  if(data)STATE._inventoryData=data;
  render();
}

const TEAM_SECTIONS=[['Дашборд','dashboard'],['Расписание','schedule'],['Пациенты','patients'],['Лечение','treatment'],['Финансы','finance'],['Склад','inventory'],['Списание','writeoff'],['Коммуникации','comms'],['Аналитика','analytics'],['Команда','team'],['Настройки','settings']];

async function loadTeam(){
  const user=JSON.parse(localStorage.getItem('dentaly_user')||'{}');
  const isAdm=user.role==='owner'||user.role==='manager';
  const [usersRes,rolesRes,invitesRes]=await Promise.all([
    API.get('/api/admin/users').catch(()=>null),
    isAdm?API.get('/api/admin/roles').catch(()=>null):Promise.resolve(null),
    isAdm?API.get('/api/invites').catch(()=>null):Promise.resolve(null),
  ]);
  STATE._teamData={users:usersRes,roles:rolesRes,invites:invitesRes,currentUser:user};
}

function avBgTeam(seed){const c=['#0F766E','#7C3AED','#DC2626','#0891B2','#059669','#D97706','#4338CA','#DB2777'];let h=0;for(const ch of(seed||''))h=(h<<5)-h+ch.charCodeAt(0);return c[Math.abs(h)%c.length];}

async function teamSavePerms(){
  const changed=window._teamChanged;
  if(!changed||!changed.size){toast('Изменений нет');return;}
  const byRole={};
  document.querySelectorAll('input[data-role][data-sec]').forEach(cb=>{
    const r=cb.dataset.role;byRole[r]=byRole[r]||[];
    if(cb.checked)byRole[r].push(cb.dataset.sec);
  });
  for(const role of changed){
    try{await API.req('POST','/api/admin/roles',{role,sections:byRole[role]||[]});}
    catch(e){toast('Ошибка: '+(e.message||'не удалось сохранить'));return;}
  }
  window._teamChanged=null;
  toast('Права сохранены');
  await loadTeam();render();
}

  catch(e){toast('Ошибка: '+(e.message||''));return;}

async function submitEditTeamUser(id){
  const d=MODAL_STATE.data;
  const ctx=MODAL_STATE.ctx||{};
  const users=(STATE._teamData&&STATE._teamData.users&&STATE._teamData.users.items)||[];
  const u=users.find(x=>x.id===id)||{};
  const body={};
  if(d.fullName!=null&&d.fullName!==u.fullName)body.fullName=d.fullName.trim();

      <div class="login-field"><label class="login-label">Придумайте пароль</label>
        <input class="login-input" id="invAccPwd" type="password" placeholder="Мин. 6 символов"
          onkeydown="if(event.key==='Enter')doAcceptInvite('${token}')"></div>
      <button class="login-btn" id="invAccBtn" onclick="doAcceptInvite('${token}')">Создать аккаунт</button>
      <div class="login-error" id="invAccErr"></div>`;
  }catch(e){box.innerHTML=`<div style="color:#ef4444;text-align:center;padding:20px">Ошибка: ${escapeHTML(e.message||'')}</div>`;}
}
async function doAcceptInvite(token){
  const name=$('invAccName').value.trim();
  const email=$('invAccEmail').value.trim();
  const pwd=$('invAccPwd').value;
  const btn=$('invAccBtn'),err=$('invAccErr');
  err.style.display='none';
  if(!name){err.textContent='Укажите имя';err.style.display='block';return;}
  if(!email){err.textContent='Укажите email';err.style.display='block';return;}
  if(!pwd||pwd.length<6){err.textContent='Пароль слишком короткий (мин. 6 символов)';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Создаём аккаунт…';
  try{
    await API.req('POST','/api/invites/'+token+'/accept',{name,email,password:pwd});
    $('inviteOverlay').style.display='none';
    history.replaceState(null,'','#dashboard');
    // Автовход
    const loginData=await API.post('/api/auth/login',{email,password:pwd});
    if(loginData&&loginData.token){
      localStorage.setItem('dentaly_token',loginData.token);
      localStorage.setItem('dentaly_user',JSON.stringify(loginData.user));
    }
    hideLogin();await initData();render();toast('Аккаунт создан! Добро пожаловать');
  }catch(e){
    err.textContent=e.message||'Ошибка создания аккаунта';
    err.style.display='block';
    btn.disabled=false;btn.textContent='Создать аккаунт';
  }
}

function openCmdK(){$('cmdkBg').classList.add('show');setTimeout(()=>{$('cmdkInput').focus();renderCmdK()},10);}
function closeCmdK(){$('cmdkBg').classList.remove('show');$('cmdkInput').value='';}
function renderCmdK(){
  const q=($('cmdkInput').value||'').toLowerCase().trim();
  const actions=[
    {ico:I.plus,title:'Записать пациента',sub:'Создать новую запись',sec:'Действия',act:()=>{closeCmdK();openModal('newAppt')}},
    {ico:I.user,title:'Добавить пациента',sub:'Новая карточка в базе',sec:'Действия',act:()=>{closeCmdK();openModal('newPatient')}},
    {ico:I.cash,title:'Принять оплату',sub:'Зафиксировать платёж',sec:'Действия',act:closeCmdK},
    {ico:I.doc,title:'Создать план лечения',sub:'Составить КП для пациента',sec:'Действия',act:closeCmdK},
    {ico:I.cal,title:'Перейти к расписанию',sub:'Дашборд расписания на сегодня',sec:'Навигация',act:()=>{closeCmdK();setView('schedule')}},
    {ico:I.cash,title:'Прайс-лист',sub:'Все процедуры и цены',sec:'Навигация',act:()=>{closeCmdK();setView('finance')}},
    {ico:I.box,title:'Склад',sub:'Остатки и заказы',sec:'Навигация',act:()=>{closeCmdK();setView('inventory')}}
  ];
  const patientHits=PATIENTS.filter(p=>!q||p.name.toLowerCase().includes(q)||p.phone.includes(q)).slice(0,5).map(p=>({
    ico:`<div class="avatar sm" style="background:${doctor(p.doc).c};width:30px;height:30px;font-size:11px">${ini(p.name)}</div>`,
    title:p.name,sub:`${fmt.age(p.age)} · ${p.phone}`,sec:'Пациенты',
    act:()=>{closeCmdK();setView('patient',{patientId:p.id,patientTab:'overview',selectedTooth:null})}
  }));
  const procHits=PROCEDURES.filter(pr=>!q||pr.n.toLowerCase().includes(q)).slice(0,4).map(pr=>({
    ico:I.tooth,title:pr.n,sub:`${fmt.money(pr.p)} · ${PROC_TYPES[pr.t].name}`,sec:'Процедуры',act:closeCmdK
  }));
  const actHits=actions.filter(a=>!q||a.title.toLowerCase().includes(q)||a.sub.toLowerCase().includes(q));
  const groups={};
  [...actHits,...patientHits,...procHits].forEach(it=>{(groups[it.sec]=groups[it.sec]||[]).push(it)});
  const all=[];
  let html='';
  Object.entries(groups).forEach(([sec,items])=>{
    html+=`<div class="cmdk-section">${sec}</div>`;
    items.forEach(it=>{
      const idx=all.length;
      html+=`<div class="cmdk-item ${idx===STATE.cmdkSel?'sel':''}" data-idx="${idx}"><div class="ci-ico">${it.ico}</div><div class="ci-text"><div class="ci-title">${it.title}</div><div class="ci-sub">${it.sub}</div></div></div>`;
      all.push(it);
    });
  });
  if(!all.length)html=`<div style="padding:30px;text-align:center;color:var(--text-3);font-size:13px">Ничего не найдено</div>`;
  $('cmdkResults').innerHTML=html;
  window._cmdkAll=all;
  document.querySelectorAll('.cmdk-item').forEach(el=>el.onclick=()=>all[parseInt(el.dataset.idx)].act());
}

function openModal(type,ctx){
  MODAL_STATE={type,ctx:ctx||{},data:{}};
  // Reasonable defaults per modal
  if(type==='newAppt'){
    const _schedDocs=(STATE._schedDoctors&&STATE._schedDoctors[STATE.scheduleDay])||DOCTORS;
    MODAL_STATE.data={docId:(ctx&&ctx.docId)||(_schedDocs[0]&&_schedDocs[0].id)||DOCTORS[0].id,procs:[],procQuery:'',showNewProcForm:false,date:(ctx&&ctx.date)||new Date().toISOString().slice(0,10),time:(ctx&&ctx.time)||'10:00',patientId:(ctx&&ctx.patientId)||STATE.patientId||null,patientQuery:'',showNewPatientForm:false};
  } else if(type==='newPatient'){
    MODAL_STATE.data={lastName:'',firstName:'',phone:'',birthDate:'',source:'Google'};
  } else if(type==='editPlan'){
    const _pl=STATE._planData&&STATE._planData[STATE.patientId];
    MODAL_STATE.data={title:_pl?_pl.title||'':'',discount:_pl?_pl.discount||0:0,activeVariant:_pl?_pl.activeVariant||'standard':'standard',status:_pl?_pl.status||'in_progress':'in_progress',agreedAt:_pl?_pl.agreedAt||'':''};
  } else if(type==='createPlan'){
    MODAL_STATE.data={title:'Комплексный план лечения',discount:0,variant:'standard',stages:[]};
  } else if(type==='addVisit'){
    MODAL_STATE.data={title:'',date:new Date().toISOString().slice(0,10),docId:DOCTORS[0].id,duration:60,stages:[]};
  } else if(type==='acceptPayment'){
    MODAL_STATE.data={patientId:ctx&&ctx.patientId||null,patientQuery:'',showNewPatientForm:false,amount:'',method:'',methodQuery:'',title:''};
  } else if(type==='editPatient'){
    const p=patient(ctx&&ctx.patientId);
    MODAL_STATE.data={
      fullName:p?p.name:'',phone:p?p.phone:'',email:p?p.email||'':'',
      birthDate:p?p.birthDate||'':'',source:p?p.source||'':'',
      leadDoctorId:p?p.doc||'':'',medicalNote:p?p.note||''  :''
    };
  } else if(type==='newProcedure'){
    MODAL_STATE.data={name:'',price:0,categoryId:'ther',durationMin:30,cost:0};
  } else if(type==='editProcedure'){
    const pr=PROCEDURES.find(x=>x.id===(ctx&&ctx.procId));
    MODAL_STATE.data=pr?{name:pr.n,price:pr.p,categoryId:pr.t,durationMin:pr.dur||30,cost:pr.cost||0}:{name:'',price:0,categoryId:'ther',durationMin:30,cost:0};
  } else if(type==='editPlanVisit'){
    const v=ctx&&ctx.visit;
    MODAL_STATE.data={title:v?v.title:'',visitDate:v?v.date:'',doctorId:v?v.docId:'',durationMin:v?v.duration:60};
  } else if(type==='newTemplate'){
    MODAL_STATE.data={name:'',body:'',channel:'any'};
  } else if(type==='newAutomation'){
    MODAL_STATE.data={name:'',description:'',channels:[],trigger:'',status:'active'};
  } else if(type==='editAutomation'){
    const a=ctx&&ctx.automation;
    MODAL_STATE.data={name:a?a.name:'',description:a?a.description:'',channels:a?a.channels:[],trigger:a?a.trigger||'':'',status:a?a.status:'active'};
  } else if(type==='editTemplate'){
    const t=ctx&&ctx.template;
    MODAL_STATE.data={name:t?t.name:'',body:t?t.body:'',channel:t?t.channel:'any'};
  } else if(type==='editInventoryItem'){
    const inv=STATE._inventoryData;
    const item=inv&&inv.items.find(x=>x.id===(ctx&&ctx.itemId));
    MODAL_STATE.data=item?{
      name:item.name,category:item.category||'Расходники',
      minStock:item.minStock,unit:item.unit||'шт',
      cost:item.cost,expiry:item.expiry||'',supplier:item.supplier||''
    }:{name:'',category:'Расходники',minStock:0,unit:'шт',cost:0,expiry:'',supplier:''};
  } else if(type==='toothProc'){
    const patId=STATE.patientId;
    const tooth=STATE.selectedTooth;
    const existing=(STATE._teethData&&STATE._teethData[patId]&&STATE._teethData[patId][tooth])||{};
    let curState='';
    if(existing.state)curState=existing.state;
    else if(existing.seg){
      const segs=Object.values(existing.seg);
      if(segs.includes('caries'))curState='caries';
      else if(segs.includes('filling'))curState='filling';
    }
    MODAL_STATE.data={state:curState};
  } else if(type==='inviteTeamUser'){
    MODAL_STATE.data={name:'',email:'',role:'doctor'};
  } else if(type==='editTeamUser'){
    const _eu=(STATE._teamData&&STATE._teamData.users&&STATE._teamData.users.items)||[];
    const _u=_eu.find(x=>x.id===(ctx&&ctx.uid))||{};
    MODAL_STATE.data={fullName:_u.fullName||'',email:_u.email||'',role:_u.role||''};
  } else if(type==='newInventoryItem'){
    MODAL_STATE.data={name:'',category:'Расходники',stock:0,minStock:0,unit:'шт',cost:0,supplier:''};
  } else if(type==='receiptInventory'){
    const inv=STATE._inventoryData;
    MODAL_STATE.data={itemId:inv&&inv.items[0]?inv.items[0].id:'',qty:1,reason:''};
  } else if(type==='doctorWriteoff'){
    const _u=JSON.parse(localStorage.getItem('dentaly_user')||'{}');
    const _lock=(_u.role==='doctor'||_u.role==='hygienist');
    MODAL_STATE.data={_editId:ctx&&ctx._editId||null,itemId:ctx&&ctx.itemId||'',materialQuery:'',qty:ctx&&ctx.qty||1,reason:ctx&&ctx.reason||'',doctorId:ctx?(ctx.doctorId||''):(_lock?_u.id:''),doctorQuery:''};
  }
  renderModal();
  $('modalBg').classList.add('show');
}

  </div>`;
}
function saveToothState(){
  const tooth=STATE.selectedTooth;
  const patId=STATE.patientId;
  const state=MODAL_STATE.data.state;
  if(!STATE._teethData)STATE._teethData={};
  if(!STATE._teethData[patId])STATE._teethData[patId]={};
  if(!state){
    delete STATE._teethData[patId][tooth];
  } else if(['crown','implant','endo','extracted'].includes(state)){
    STATE._teethData[patId][tooth]={state};
  } else if(state==='caries'){
    STATE._teethData[patId][tooth]={seg:{top:'caries',bottom:'caries',left:'caries',right:'caries'}};
  } else if(state==='filling'){
    STATE._teethData[patId][tooth]={seg:{top:'filling',bottom:'filling',left:'filling',right:'filling'}};
  }
  closeModal();
  $('pcTabContent').innerHTML=renderPatientTab(patient(patId),'teeth');
}
function deleteToothState(){
  const tooth=STATE.selectedTooth;
  const patId=STATE.patientId;
  if(STATE._teethData&&STATE._teethData[patId])delete STATE._teethData[patId][tooth];
  $('pcTabContent').innerHTML=renderPatientTab(patient(patId),'teeth');
}

  const name=($('newProcName').value||'').trim();

  const dur=parseInt($('newProcDur').value||'30');
  const categoryId=$('newProcCat').value||'ther';
  if(!name){toast('Введите название');return;}
  if(!price||price<=0){toast('Введите цену');return;}
  let id;

      id=res.id;
    }catch(e){toast('Ошибка: '+(e.message||'не удалось создать процедуру'));return;}
  } else {
    id=crypto.randomUUID();
  }
  PROCEDURES.push({id,n:name,p:price,t:categoryId,dur,cost:0,margin:0});
  const procs=MODAL_STATE.data.procs||[];

async function submitNewAppt(){
  const d=MODAL_STATE.data;
  const dateEl=$('apptDate'),timeEl=$('apptTime');
  let date=(dateEl&&dateEl.value)||d.date||new Date().toISOString().slice(0,10);
  const time=(timeEl&&timeEl.value)||d.time||'09:00';
  if(/^\d{2}\.\d{2}\.\d{4}$/.test(date)){const[dd,mm,yyyy]=date.split('.');date=`${yyyy}-${mm}-${dd}`;}
  if(!d.docId){toast('Выберите врача');return;}
  if(!d.patientId){toast('Выберите пациента');return;}
  const procs=d.procs||[];
  if(!procs.length){toast('Выберите хотя бы одну процедуру');return;}
  const startsAt=new Date(date+'T'+time+':00+05:00').getTime();
  const totalPrice=procs.reduce((s,p)=>s+p.p,0);
  const totalDur=procs.reduce((s,p)=>s+(p.dur||30),0);
  const procNames=procs.map(p=>p.n).join(', ');
  try{
    const result=await API.post('/api/appointments',{
      patientId:d.patientId,doctorId:d.docId,startsAt,durationMin:totalDur,
      procedureId:procs[0].id,procedureName:procNames,price:totalPrice,categoryId:procs[0].t,
      note:procNames
    });
    closeModal();
    toast('Запись создана');
    await loadSchedule();
    if(result?.id){
      const appt=APPOINTMENTS.find(x=>x.id===result.id);
      if(appt){appt.procName=procNames;appt.procPrice=totalPrice;appt.procs=procs;}
    }
    render();
  }catch(e){toast('Ошибка: '+(e.message||'не удалось создать запись'));}
}

const PAYMENT_METHODS=['Наличные','Банковский перевод','Карта','Рассрочка','Корпоративный счёт'];
function paymentMethodSearch(q){
  MODAL_STATE.data.methodQuery=q;
  const res=$('methodSearchResults');
  if(!res)return;
  const ql=(q||'').toLowerCase();
  const filtered=ql?PAYMENT_METHODS.filter(m=>m.toLowerCase().includes(ql)):PAYMENT_METHODS;
  const exactMatch=PAYMENT_METHODS.some(m=>m.toLowerCase()===ql);
  let html=`<div style="position:absolute;left:0;right:0;top:calc(100% + 2px);background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:50;overflow:hidden">`;
  if(filtered.length){
    html+=filtered.map(m=>`<div onclick="selectPaymentMethod('${m.replace(/'/g,"&#39;")}')" style="padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border-2)" onmouseenter="this.style.background='var(--primary-tint)'" onmouseleave="this.style.background=''">${escapeHTML(m)}</div>`).join('');
  } else {
    html+=`<div style="padding:10px 14px;font-size:12.5px;color:var(--text-3)">Нет совпадений</div>`;
  }
  if(q.trim()&&!exactMatch){
    html+=`<div onclick="selectPaymentMethod('${q.trim().replace(/'/g,"&#39;")}')" style="display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;color:var(--primary);font-weight:600;font-size:12.5px;border-top:1px solid var(--border-2)" onmouseenter="this.style.background='var(--primary-tint)'" onmouseleave="this.style.background=''"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Использовать «${escapeHTML(q.trim())}»</div>`;
  }
  html+='</div>';
  res.innerHTML=html;
}
function selectPaymentMethod(m){
  MODAL_STATE.data.method=m;
  MODAL_STATE.data.methodQuery='';
  renderModal();
}

async function submitEditPatient(pid){
  const d=MODAL_STATE.data;
  if(!d.fullName||!d.phone){toast('Имя и телефон обязательны');return;}
  try{
    const res=await API.req('PATCH','/api/patients/'+pid,{

      ...(d.email?{email:d.email}:{}),
      ...(d.birthDate?{birthDate:d.birthDate}:{}),

      medicalNote:d.medicalNote||''
    });

    // Обновляем локальный PATIENTS[]
    const p=PATIENTS.find(x=>x.id===pid);

      p.name=d.fullName;p.phone=d.phone;p.email=d.email;
      if(d.birthDate)p.birthDate=d.birthDate;
      if(d.source)p.source=d.source;

      p.note=d.medicalNote;

    // Обновляем кэш пациента
    if(STATE._patientData&&STATE._patientData[pid]){
      const pd=STATE._patientData[pid];
      pd.fullName=d.fullName;pd.phone=d.phone;pd.email=d.email;

      if(d.leadDoctorId)pd.leadDoctorId=d.leadDoctorId;
      pd.medicalNote=d.medicalNote;
    }

    toast('Данные пациента обновлены');

}

async function markAllRead(){
  await API.req('PATCH','/api/notifications/read-all');
  $('notifPop').classList.remove('show');

function fmtAgo(ts){
  const d=Date.now()-ts;const m=Math.floor(d/60000);
  if(m<2)return'только что';if(m<60)return m+' мин';
  const h=Math.floor(d/3600000);if(h<24)return h+' ч';
  return Math.floor(d/86400000)+' дн';
}

const API_URL='https://dentaly-worker.rahymstar13.workers.dev';
const API={
  token(){return localStorage.getItem('dentaly_token')},
  async req(method,path,body){
    const h={'Content-Type':'application/json'};
    if(this.token())h['Authorization']='Bearer '+this.token();
    const res=await fetch(API_URL+path,{method,headers:h,...(body!==undefined?{body:JSON.stringify(body)}:{})});
    const data=await res.json().catch(()=>({}));
    if(res.status===401){showLogin();return null}
    if(!res.ok)throw new Error(data.error||'API error '+res.status);
    return data;
  },
  get(path){return this.req('GET',path)},
  post(path,body){return this.req('POST',path,body)},
  patch(path,body){return this.req('PATCH',path,body)},
};

function ensureDoctor(info){
  if(!info)return DOCTORS[0];
  const found=DOCTORS.find(d=>d.name===info.name);
  if(found)return found;
  const s={id:'_d_'+info.name.replace(/\s/g,''),name:info.name,
    ini:info.initials||info.name.split(' ').map(s=>s[0]).join('').slice(0,2),
    c:info.color||'#0F766E',spec:'',load:0};
  DOCTORS.push(s);return s;
}

function apiToLocal(p){
  const age=p.birthDate?Math.floor((Date.now()-new Date(p.birthDate))/31557600000):30;
  const doc=ensureDoctor(p.doctor);
  const local={
    id:p.id,name:p.fullName,age,phone:p.phone||'',email:p.email||'',
    balance:p.balance||0,lastVisit:p.lastVisit,doc:doc.id,
    tag:p.tag||'active',source:p.source||'',since:p.registeredAt||'',
    visits:p.visitsCount||0,risk:p.riskScore||0,note:p.medicalNote||null,
    loyalty:p.loyalty?{pts:p.loyalty.points,tier:p.loyalty.tier,next:0}:null,
    family:(p.family||[]).map(f=>f.id),nextAppointment:p.nextAppointment||null,
  };
  STATE._patientsCache[p.id]=local;
  return local;
}

function getWeekDate(dayIndex){
  const offset=STATE.scheduleWeekOffset||0;
  const d=new Date();const dow=d.getDay();
  const mon=new Date(d);
  mon.setDate(d.getDate()-(dow===0?6:dow-1)+offset*7);
  mon.setHours(0,0,0,0);
  const t=new Date(mon);t.setDate(mon.getDate()+dayIndex);
  return t.toISOString().slice(0,10);
}
function scheduleWeekLabel(){
  const mon=getWeekDate(0);const sun=getWeekDate(6);
  const f=s=>{const[,m,d]=s.split('-');return d+'.'+m;};
  return f(mon)+'–'+f(sun);
}
async function goScheduleWeek(delta){
  STATE.scheduleWeekOffset=(STATE.scheduleWeekOffset||0)+delta;
  await loadSchedule();render();
}
async function goScheduleDate(isoDate){
  if(!isoDate)return;
  const d=new Date(isoDate);const dow=d.getDay();
  const dayIdx=dow===0?6:dow-1;
  const today=new Date();const todayDow=today.getDay();
  const monToday=new Date(today);
  monToday.setDate(today.getDate()-(todayDow===0?6:todayDow-1));monToday.setHours(0,0,0,0);
  const monTarget=new Date(d);
  monTarget.setDate(d.getDate()-(dow===0?6:dow-1));monTarget.setHours(0,0,0,0);
  const diffMs=monTarget-monToday;
  STATE.scheduleWeekOffset=Math.round(diffMs/(7*86400000));
  STATE.scheduleDay=dayIdx;
  await loadSchedule();render();
}

async function loadSchedule(){
  const date=getWeekDate(STATE.scheduleDay);
  const data=await API.get('/api/schedule?date='+date);
  if(!data)return;
  STATE._schedDoctors=STATE._schedDoctors||{};
  STATE._schedDoctors[STATE.scheduleDay]=(data.doctors||[]).map(d=>{
    const ini2=d.initials||(d.fullName||'').split(' ').map(s=>s[0]).join('').slice(0,2);
    const mapped={id:d.id,name:d.fullName||'',ini:ini2,c:d.color||'#0F766E',spec:d.specialty||'',load:0};
    const existing=DOCTORS.find(x=>x.id===d.id);
    if(existing)Object.assign(existing,{name:mapped.name,ini:mapped.ini,c:mapped.c,spec:mapped.spec});
    else DOCTORS.push(mapped);
    return mapped;
  });
  const dayAppts=data.appointments.map(a=>{
    const d=new Date(a.startsAt);
    const hh=d.getHours().toString().padStart(2,'0');
    const mm=d.getMinutes().toString().padStart(2,'0');
    if(a.patientName&&!STATE._patientsCache[a.patientId]){
      const s={id:a.patientId,name:a.patientName,age:0,phone:a.patientPhone||'',
        email:'',balance:0,lastVisit:null,doc:'d1',tag:'active',source:'',
        since:'',visits:0,risk:0,note:a.medicalNote||null,loyalty:null,family:[]};
      STATE._patientsCache[a.patientId]=s;
      if(!PATIENTS.find(p=>p.id===a.patientId))PATIENTS.push(s);
    }
    const wo=STATE.scheduleWeekOffset||0;
    return{id:a.id,docId:a.doctorId,day:STATE.scheduleDay,weekOffset:wo,start:`${hh}:${mm}`,
      startsAt:a.startsAt,dur:a.durationMin,patientId:a.patientId,procName:a.procedureName||a.note||'—',
      procType:a.categoryId||'ther',procPrice:a.price||0,status:a.status,risk:a.riskScore||0};
  });
  const wo=STATE.scheduleWeekOffset||0;
  const rest=APPOINTMENTS.filter(a=>!(a.day===STATE.scheduleDay&&(a.weekOffset||0)===wo));
  APPOINTMENTS.splice(0,APPOINTMENTS.length,...rest,...dayAppts);
  const fmt2=d=>new Date(d).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
  const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  for(let i=0;i<7;i++)WEEK_DAYS[i]=days[i]+' '+fmt2(getWeekDate(i)).slice(0,5);
}
