name = "dentaly-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "aad3951dff9cc14cbb8a465eb713e668"

[[d1_databases]]
binding = "DB"
database_name = "dentaly-db"
database_id = "ca3b3e25-6937-4712-bc2c-e0cd3a120d86"

[[kv_namespaces]]
binding = "AUTH_CACHE"
id = "33a1e6987c3a4ff2b26be53df3bfe0a1"

[[durable_objects.bindings]]
name = "CLINIC_ROOM"
class_name = "ClinicRoom"

[[durable_objects.bindings]]
name = "USER_NOTIFY_ROOM"
class_name = "UserNotifyRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClinicRoom", "UserNotifyRoom"]

[triggers]
crons = [
  "*/15 * * * *",   # напоминания о записях (за 24ч и за 2ч)
  "0 4 * * *",      # сегменты пациентов + проверка склада (09:00 Алматы)
  "0 4 * * 1"       # реактивация спящих (пн 09:00 Алматы)
]

[vars]
ENVIRONMENT = "development"
APP_URL = "https://dentistry-main.rahymstar13.workers.dev"

# Secrets (set via wrangler secret put, NOT here):
# JWT_SECRET
# WHATSAPP_TOKEN
# WHATSAPP_PHONE_ID
# TELEGRAM_BOT_TOKEN
# MOBIZON_API_KEY
# KASPI_MERCHANT_ID
# KASPI_SECRET
# OPENAI_API_KEY
# DOCXTOPDF_URL
